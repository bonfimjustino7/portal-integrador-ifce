<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Autenticando</title>
  </head>
  <body>
    <p>Autenticando...</p>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const userId = params.get('userId');
        const username = params.get('username');
        const role = params.get('role');

        if (!token || !userId || !username || !role) {
          window.location.replace('/login');
          return;
        }

        localStorage.setItem('token', token);
        localStorage.setItem('userId', userId);
        localStorage.setItem('username', username);
        localStorage.setItem('role', role);

        window.history.replaceState({}, document.title, '/auth-bridge');

        const routesByRole = {
          Admin: '/admin/usuarios',
          'Diretor Ensino': '/diretor_ensino/horarios-gerados',
          Coordenador: '/coordenador/horarios',
          Professor: '/professor/horario-individual',
        };

        window.location.replace(routesByRole[role] || '/home');
      })();
    </script>
  </body>
</html>
