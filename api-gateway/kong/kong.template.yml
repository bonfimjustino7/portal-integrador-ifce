_format_version: "3.0"
_transform: true

services:
  - name: acl-horarios-integration
    url: http://acl:8080/sistema/horarios-professores/integration
    routes:
      - name: horarios-integration-api
        paths:
          - /gateway/horarios/sistema/horarios-professores/integration
        strip_path: true
        methods:
          - GET
          - OPTIONS
  - name: acl-horarios
    url: http://acl:8080
    routes:
      - name: horarios-exchange
        paths:
          - /gateway/horarios
        strip_path: true
        methods:
          - GET
          - POST
          - OPTIONS
  - name: professor-complements
    url: http://professor-complements-service:4300
    routes:
      - name: professor-complements-api
        paths:
          - /gateway/professor-complements
        strip_path: true
        methods:
          - GET
          - OPTIONS

plugins:
  - name: jwt
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      run_on_preflight: false
  - name: rate-limiting
    config:
      minute: 60
      policy: local
      fault_tolerant: true
      hide_client_headers: false
  - name: cors
    config:
      origins:
        - http://localhost:4000
        - http://localhost:4101
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      credentials: true
      max_age: 3600
  - name: proxy-cache
    route: horarios-integration-api
    config:
      response_code:
        - 200
      request_method:
        - GET
      content_type:
        - application/json
        - application/json; charset=utf-8
      vary_headers:
        - Authorization
      cache_ttl: 120
      strategy: memory
  - name: proxy-cache
    route: professor-complements-api
    config:
      response_code:
        - 200
      request_method:
        - GET
      content_type:
        - application/json
        - application/json; charset=utf-8
      vary_headers:
        - Authorization
      cache_ttl: 300
      strategy: memory

consumers:
  - username: bff-service
    jwt_secrets:
      - key: __KEYCLOAK_ISSUER__
        algorithm: RS256
        rsa_public_key: |
__KEYCLOAK_PUBLIC_KEY_PEM__
