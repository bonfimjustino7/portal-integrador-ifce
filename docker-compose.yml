services:
  portal:
    build: ./microfrontends/portal/mfc
    ports:
      - "9000:9000"
    environment:
      VITE_BFF_URL: http://localhost:4000
      VITE_ANGULAR_MFE_URL: http://localhost:4201
      VITE_ANGULAR_BFF_URL: http://localhost:4101
      VITE_KEYCLOAK_URL: http://localhost:8180
      VITE_KEYCLOAK_REALM: university
      VITE_KEYCLOAK_CLIENT_ID: painel-integrador
    depends_on:
      - bff
      - keycloak
      - angular-mfe

  angular-mfe:
    build: ./microfrontends/angular-demo/mfc
    ports:
      - "4201:4201"
    environment:
      PORT: 4201
    depends_on:
      - angular-bff

  angular-bff:
    build: ./microfrontends/angular-demo/bff
    ports:
      - "4101:4101"
    environment:
      PORT: 4101
      CORS_ORIGIN: http://localhost:9000
      KONG_URL: http://kong:8000
      LEGACY_PROFESSORS_PATH: /gateway/horarios/sistema/horarios-professores/integration/professors
      PROFESSOR_COMPLEMENTS_PATH: /gateway/professor-complements/api/professor-complements
    depends_on:
      - kong

  bff:
    build: ./microfrontends/portal/bff
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      KONG_URL: http://kong:8000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: university
      CORS_ORIGIN: http://localhost:9000
      ACL_PUBLIC_URL: http://localhost:8080
    depends_on:
      - kong

  kong:
    build: ./api-gateway/kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/generated/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KEYCLOAK_INTERNAL_REALM_URL: http://keycloak:8080/realms/university
      KEYCLOAK_PUBLIC_ISSUER: http://localhost:8180/realms/university
    expose:
      - "8000"
      - "8001"
    depends_on:
      - acl
      - keycloak
      - professor-complements-service

  professor-complements-service:
    build: ./microservices/professor-complements
    environment:
      PORT: 4300
      DB_HOST: professor-complements-db
      DB_PORT: 3306
      DB_USER: professor_complements_user
      DB_PASSWORD: professor_complements_password
      DB_DATABASE: professor_complements
    expose:
      - "4300"
    depends_on:
      professor-complements-db:
        condition: service_healthy

  professor-complements-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: professor-complements-root-password
      MYSQL_DATABASE: professor_complements
      MYSQL_USER: professor_complements_user
      MYSQL_PASSWORD: professor_complements_password
    volumes:
      - professor-complements-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pprofessor-complements-root-password"]
      interval: 10s
      timeout: 5s
      retries: 10

  acl:
    build: ./legados/horarios/acl
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: university
      KEYCLOAK_CLIENT_ID: acl-client
      KEYCLOAK_CLIENT_SECRET: acl-secret
      LEGACY_SERVER_URL: http://legacy-server:5001
      LEGACY_CLIENT_URL: http://legacy-client:3000
      INTERNAL_API_KEY: dev-internal-api-key
      JWT_SECRET: dev-jwt-secret
      JWT_EXPIRES_IN: 8h
    depends_on:
      - legacy-server
      - legacy-client
      - keycloak

  legacy-client:
    build:
      context: ./legados/horarios/sistema/client
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      WDS_SOCKET_PORT: 8080
      REACT_APP_API_BASE_URL: http://localhost:8080/api
    expose:
      - "3000"
    depends_on:
      - legacy-server

  legacy-server:
    build:
      context: ./legados/horarios/sistema/server
    environment:
      NODE_ENV: development
      PORT: 5001
      DB_USERNAME: horario_user
      DB_PASSWORD: horario_password
      DB_DATABASE_DEVELOPMENT: horario_professor_dev
      DB_DATABASE_TEST: horario_professor_test
      DB_DATABASE_PRODUCTION: horario_professor_prod
      DB_HOST: legacy-db
      DB_DIALECT: mysql
      JWT_SECRET: dev-jwt-secret
      INTERNAL_API_KEY: dev-internal-api-key
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_SECURE: "false"
      EMAIL_USER: dev@example.com
      EMAIL_PASSWORD: dev-password
      EMAIL_FROM: "Horario Dev"
    expose:
      - "5001"
    depends_on:
      legacy-db:
        condition: service_healthy

  legacy-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MYSQL_DATABASE: horario_professor_dev
      MYSQL_USER: horario_user
      MYSQL_PASSWORD: horario_password
    volumes:
      - legacy-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot-password"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8180", "--hostname-strict=false"]
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./sso/keycloak:/opt/keycloak/data/import

volumes:
  legacy-db-data:
  professor-complements-db-data:
